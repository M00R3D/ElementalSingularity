<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hair Shape Editor – Elemental Singularity</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0c1018; color: #c8daf0; font-family: "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }

    /* ─── sidebar ──────────────────────────── */
    .sidebar { width: 320px; min-width: 260px; background: #111826; border-right: 2px solid #1e2d40; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar h2 { padding: 10px 14px 6px; font-size: 15px; color: #7abaff; border-bottom: 1px solid #1e2d40; }
    .sidebar section { padding: 8px 14px; border-bottom: 1px solid #1a2538; }
    .sidebar label { display: block; font-size: 11px; color: #6a8dbb; margin-top: 5px; }
    .sidebar select, .sidebar input[type=number], .sidebar input[type=text] {
      width: 100%; background: #182030; color: #c8daf0; border: 1px solid #2a3d55; border-radius: 3px; padding: 3px 6px; font-size: 12px; margin-top: 2px;
    }
    .sidebar input[type=color] { width: 36px; height: 22px; border: none; background: none; cursor: pointer; vertical-align: middle; }
    .sidebar button {
      background: #1e3050; color: #9ec7ff; border: 1px solid #2a4060; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; margin: 2px 1px;
    }
    .sidebar button:hover { background: #2a4568; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
    textarea#io { width: 100%; height: 80px; background: #0e1622; color: #aac8e6; border: 1px solid #2a3d55; border-radius: 3px; font-size: 10px; resize: vertical; }
    #status { font-size: 11px; padding: 6px 14px; color: #9fcbff; }

    /* ─── canvas area ──────────────────────── */
    .canvas-wrap { flex: 1; position: relative; }
    .canvas-wrap canvas { width: 100%; height: 100%; display: block; }

    /* ─── checkbox ─────────────────────────── */
    .cb-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .cb-row input[type=checkbox] { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>Hair Shape Editor</h2>

    <!-- Character Preview Settings -->
    <section>
      <label>Hair Style 1 (back)
        <select id="hair1Style"></select>
      </label>
      <label>Hair Style 2 (front)
        <select id="hair2Style"></select>
      </label>
      <label>Size
        <input type="number" id="previewSize" min="12" max="21" value="15" />
      </label>
      <label>Face
        <select id="previewFaceType">
          <option value="friendly">friendly</option>
          <option value="serious">serious</option>
          <option value="grin">grin</option>
        </select>
      </label>
      <label>Eyes
        <select id="previewEyeType">
          <option value="round">round</option>
          <option value="sharp">sharp</option>
          <option value="sleepy">sleepy</option>
          <option value="big">big</option>
        </select>
      </label>
      <label>Body Color <input type="color" id="previewBodyColor" value="#ff7a59" /></label>
      <label>Hair Color <input type="color" id="previewHairColor" value="#4b2e20" /></label>
      <label>Accessory
        <select id="previewAccessory">
          <option value="none">none</option>
          <option value="bandana">bandana</option>
          <option value="glasses">glasses</option>
          <option value="earring">earring</option>
          <option value="crown">crown</option>
          <option value="headphones">headphones</option>
          <option value="mask">mask</option>
        </select>
      </label>
      <div class="cb-row">
        <input type="checkbox" id="previewBackShell" />
        <label for="previewBackShell" style="margin:0">Show Back Shell</label>
      </div>
    </section>

    <!-- Shape Editing -->
    <section>
      <label>Active Layer
        <select id="targetLayer">
          <option value="hairBehindFace">Behind Face</option>
          <option value="hair1" selected>Hair 1 (back)</option>
          <option value="hair2">Hair 2 (front)</option>
        </select>
      </label>
      <label>Shape Type
        <select id="shapeType">
          <option value="circle">circle</option>
          <option value="rect">rect</option>
          <option value="triangle">triangle</option>
          <option value="spiral">spiral</option>
          <option value="spike">spike</option>
          <option value="crescent">crescent</option>
          <option value="leaf">leaf</option>
          <option value="curly">curly</option>
          <option value="anime1">anime1 (S strand)</option>
          <option value="anime2">anime2 (spiky up)</option>
          <option value="anime3">anime3 (ribbon)</option>
          <option value="anime4">anime4 (realistic)</option>
        </select>
      </label>
      <label>New Shape Color <input type="color" id="shapeColor" value="#4b2e20" /></label>
      <div class="btn-row">
        <button id="btnAdd">+ Add</button>
        <button id="btnDuplicate">Duplicate</button>
        <button id="btnDelete">Delete</button>
        <button id="btnClearLayer">Clear Layer</button>
        <button id="btnClearAll">Clear All</button>
        <button id="btnClearSelection">Deselect</button>
      </div>
    </section>

    <!-- Shape Properties -->
    <section>
      <strong style="font-size:11px">Selected Shape</strong>
      <div class="prop-grid">
        <label>X <input type="number" id="propX" step="0.01" /></label>
        <label>Y <input type="number" id="propY" step="0.01" /></label>
        <label>W <input type="number" id="propW" step="0.01" min="0" /></label>
        <label>H <input type="number" id="propH" step="0.01" min="0" /></label>
        <label>R <input type="number" id="propR" step="0.01" min="0" /></label>
        <label>Rot <input type="number" id="propRot" step="1" /></label>
      </div>
      <label>Color <input type="color" id="propColor" value="#4b2e20" /></label>
      <div style="margin-top:6px">
        <strong style="font-size:11px">Group Transform</strong>
        <div class="prop-grid">
          <label>Rotate° <input type="number" id="propGroupRot" step="1" value="0" /></label>
          <label>ScaleX <input type="number" id="propScaleX" step="0.1" value="1" /></label>
          <label>ScaleY <input type="number" id="propScaleY" step="0.1" value="1" /></label>
        </div>
        <button id="btnApplyTransform" style="margin-top:4px">Apply Transform</button>
      </div>
    </section>

    <!-- Camera -->
    <section>
      <div class="btn-row">
        <button id="btnResetCamera">Reset Camera</button>
      </div>
      <span style="font-size:10px;color:#4a6a8a">Scroll = zoom · Alt+drag = pan · Middle-click = pan</span>
    </section>

    <!-- Export / Import -->
    <section>
      <div class="btn-row">
        <button id="btnExport">Export JSON</button>
        <button id="btnImport">Import JSON</button>
        <button id="btnCopy">Copy JSON</button>
      </div>
      <div class="btn-row" style="margin-top:4px">
        <button id="btnInsertFancy">Insert fancy_anime</button>
        <button id="btnInsertSpiky">Insert special_spiky</button>
      </div>
      <textarea id="io" spellcheck="false"></textarea>
    </section>

    <div id="status">Loading…</div>
    <div style="font-size:10px;color:#3a5a78;padding:6px 14px">
      Shortcuts: [ ] = rotate ± 5° · Del = delete · Scroll on shape = resize
    </div>
  </aside>

  <section class="canvas-wrap">
    <canvas id="stage" width="1000" height="1000"></canvas>
  </section>

  <script type="module">
    import { HairShapeEditor } from './editor/editor.js';

    const canvas = document.getElementById('stage');
    const editor = new HairShapeEditor(canvas);

    // Collect all UI element references
    const el = {
      hair1Style: document.getElementById("hair1Style"),
      hair2Style: document.getElementById("hair2Style"),
      previewSize: document.getElementById("previewSize"),
      previewFaceType: document.getElementById("previewFaceType"),
      previewEyeType: document.getElementById("previewEyeType"),
      previewBodyColor: document.getElementById("previewBodyColor"),
      previewHairColor: document.getElementById("previewHairColor"),
      previewAccessory: document.getElementById("previewAccessory"),
      previewBackShell: document.getElementById("previewBackShell"),
      targetLayer: document.getElementById("targetLayer"),
      shapeType: document.getElementById("shapeType"),
      shapeColor: document.getElementById("shapeColor"),
      btnAdd: document.getElementById("btnAdd"),
      btnDuplicate: document.getElementById("btnDuplicate"),
      btnDelete: document.getElementById("btnDelete"),
      btnClearLayer: document.getElementById("btnClearLayer"),
      btnClearAll: document.getElementById("btnClearAll"),
      btnClearSelection: document.getElementById("btnClearSelection"),
      btnResetCamera: document.getElementById("btnResetCamera"),
      propX: document.getElementById("propX"),
      propY: document.getElementById("propY"),
      propW: document.getElementById("propW"),
      propH: document.getElementById("propH"),
      propR: document.getElementById("propR"),
      propRot: document.getElementById("propRot"),
      propGroupRot: document.getElementById("propGroupRot"),
      propScaleX: document.getElementById("propScaleX"),
      propScaleY: document.getElementById("propScaleY"),
      btnApplyTransform: document.getElementById("btnApplyTransform"),
      propColor: document.getElementById("propColor"),
      btnExport: document.getElementById("btnExport"),
      btnImport: document.getElementById("btnImport"),
      btnCopy: document.getElementById("btnCopy"),
      btnInsertFancy: document.getElementById("btnInsertFancy"),
      btnInsertSpiky: document.getElementById("btnInsertSpiky"),
      io: document.getElementById("io"),
      status: document.getElementById("status")
    };

    editor.wireUI(el);
    editor.boot();
  </script>
</body>
</html>
