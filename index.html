<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elemental Singularity</title>
  <style>
    html, body { height: 100%; margin: 0; background: #060912; color: #eef4ff; font-family: Segoe UI, sans-serif; overflow: hidden; }
    canvas { display: block; }
    #panels { position: fixed; right: 12px; top: 12px; width: 340px; z-index: 20; font-size: 14px; }
    .panel { background: rgba(10,14,24,0.88); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; margin-bottom: 10px; backdrop-filter: blur(6px); }
    .title { font-weight: 700; margin-bottom: 6px; }
    #menuOverlay { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1080px, 96vw); max-height: 84vh; overflow: auto; z-index: 40; background: rgba(8,11,20,0.96); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px; }
    #menuContent { margin-top: 12px; }
    #hotbar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 30; flex-wrap: wrap; justify-content: center; max-width: min(980px, 96vw); }
    #deathOverlay { display: none; position: fixed; inset: 0; z-index: 45; pointer-events: none; }
    #deathCard { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); width: min(560px, 90vw); background: rgba(8,11,20,0.92); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 18px; pointer-events: auto; }
    .chip { display: inline-flex; align-items: center; gap: 6px; margin: 4px 6px 0 0; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
    button { background: #152235; border: 1px solid rgba(255,255,255,0.12); color: #eef4ff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: #1c2f49; }
    label { margin-right: 10px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="panels">
    <div class="panel">
      <div class="title">Ability Archive</div>
      <div id="abilityList"></div>
      <div class="title" style="margin-top:8px">Build Signals</div>
      <div id="elementPool"></div>
    </div>

    <div class="panel">
      <div class="title">Player Visuals</div>
      <div>
        <label><input type="checkbox" id="vis-arms" /> Arms</label>
        <label><input type="checkbox" id="vis-legs" /> Legs</label>
      </div>
      <div style="margin-top:8px">
        <button id="savePreset">Save Preset</button>
      </div>
      <div id="presets" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <div class="title">Spawners</div>
      <div id="spawnerList"></div>
    </div>

    <div class="panel">
      <div class="title">Inventory</div>
      <div id="inventoryList"></div>
    </div>

    <div class="panel">
      <div class="title">Machine Cores</div>
      <div id="machineList"></div>
    </div>
  </div>

  <div id="menuOverlay">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="title" style="margin:0">Menu</div>
      <div style="margin-left:auto">Level <span id="ui-level">1</span> | Element Points <span id="ui-ep">0</span></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button id="tab-shop">Element Shop</button>
      <button id="tab-equip">Equip Abilities</button>
      <button id="tab-inventory">Inventory</button>
      <button id="tab-crafting">Crafting</button>
      <button id="tab-alchemy">Alchemy</button>
      <button id="tab-machines">Machines</button>
      <button id="closeMenu" style="margin-left:auto">Close</button>
    </div>
    <div id="menuContent"></div>
  </div>

  <div id="hotbar"></div>

  <div id="deathOverlay">
    <div id="deathCard">
      <div class="title">Run Summary</div>
      <div id="deathSummary" style="line-height:1.7;margin-top:10px"></div>
      <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
        <button id="restartRun">Restart Run</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
